<body class="bg-[#0a0a0f] min-h-screen flex items-center justify-center relative overflow-hidden font-body-lg text-on-background selection:bg-primary-container selection:text-on-primary-container">
<!-- Background Orbs -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-blue-500/10 rounded-full blur-[120px] pointer-events-none z-0"></div>
<div class="absolute top-1/2 left-1/4 -translate-x-1/2 -translate-y-1/3 w-[600px] h-[600px] bg-purple-500/10 rounded-full blur-[100px] pointer-events-none z-0"></div>
<!-- Vignette -->
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_transparent_0%,_#0a0a0f_100%)] pointer-events-none z-0"></div>
<!-- Login Card -->
<div class="relative z-10 w-full max-w-[400px] bg-[#161b22]/95 backdrop-blur-[16px] border border-white/10 rounded-xl p-lg shadow-2xl mx-4">
<!-- Header -->
<div class="flex flex-col items-center mb-lg text-center">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-[#3b82f6] text-[28px]" style="font-variation-settings: 'FILL' 1;">insert_chart</span>
<h1 class="text-[22px] font-bold text-white tracking-tight leading-none">Agiliza Seller</h1>
</div>
<p class="font-body-md text-on-surface-variant text-body-md">Painel de inteligência para marketplaces</p>
</div>
<!-- Divider -->
<div class="h-px w-full bg-white/5 mb-lg"></div>
<!-- Form -->
<form class="flex flex-col gap-md">
<!-- Full Name Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="fullName">Nome completo</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">person</span>
<input class="w-full h-[44px] bg-[#050507] border border-white/10 rounded-lg pl-[40px] pr-3 font-body-md text-body-md text-white placeholder-outline focus:border-[#3b82f6] focus:ring-1 focus:ring-[#3b82f6] transition-colors outline-none" id="fullName" placeholder="Seu nome completo" type="text"/>
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">E-mail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full h-[44px] bg-[#050507] border border-white/10 rounded-lg pl-[40px] pr-3 font-body-md text-body-md text-white placeholder-outline focus:border-[#3b82f6] focus:ring-1 focus:ring-[#3b82f6] transition-colors outline-none" id="email" placeholder="seu@email.com" type="email"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-[44px] bg-[#3b82f6] hover:bg-blue-600 active:scale-[0.98] transition-all rounded-lg font-h3 text-h3 text-white mt-2 flex items-center justify-center" type="button">
                Entrar no painel
            </button>
</form>
<!-- Footer -->
<div class="mt-lg pt-md border-t border-white/5 flex items-center justify-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">lock</span>
<span class="font-mono-sm text-mono-sm">Ambiente de demonstração — dados fictícios</span>
</div>
</div>
